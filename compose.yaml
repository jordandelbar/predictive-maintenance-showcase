services:
  ml-service:
    build:
      context: ./ml_service
    ports:
      - "7216:7216"
    environment:
      APP_ENVIRONMENT: "production"
      APP_MODEL__ONNX_FILE: "model_0.0.1.onnx"
      APP_MODEL__SCALING_VALUES_FILE: "scaler_tensors.csv"
      APP_MODEL__NUM_INSTANCES: "16"
      APP_MODEL__MODEL_DIR: "/app/models"
      APP_MODEL__PREPROCESS_DIR: "/app/preprocess"
    networks:
      - backend

  ml-facade:
    build:
      context: ./ml_facade
    env_file:
      - ./production.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16.3-alpine
    container_name: monitoring-postgres
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: test
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:latest
    container_name: monitoring-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-demo
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - ./grafana.env
      - ./production.env
    ports:
      - "9000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - backend

  migrate:
    image: migrate/migrate
    volumes:
      - ./ml_facade/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -path /migrations -database postgres://monitor:test@postgres:5432/monitoring?sslmode=disable up
    networks:
      - backend

networks:
  backend:
