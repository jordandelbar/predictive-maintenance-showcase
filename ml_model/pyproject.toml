[project]
name = "ml-model"
version = "0.1.0"
description = "Code for training autoencoder deep learning model"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jordan Delbar", email = "jordandelbar@gmail.com" }
]
dependencies = [
    "click>=8.1.7",
    "kagglehub>=0.3.6",
    "loguru>=0.7.2",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "polars>=1.11.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "torch==2.4.0+cpu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "notebook>=7.2.2",
    "onnx>=1.17.0",
    "pre-commit>=4.0.1",
    "pytest-cov>=5.0.0",
    "pytest>=8.3.3",
]
